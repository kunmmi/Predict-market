name: Deploy to Client Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-mine:
    name: Deploy to My Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.MY_VERCEL_PROJECT_ID }}","orgId":"${{ secrets.MY_VERCEL_ORG_ID }}"}' > .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.MY_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.MY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MY_VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.MY_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.MY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MY_VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        run: vercel deploy --prebuilt --prod --token=${{ secrets.MY_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.MY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MY_VERCEL_PROJECT_ID }}

  deploy-client:
    name: Deploy to Client Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.CLIENT_VERCEL_PROJECT_ID }}","orgId":"${{ secrets.CLIENT_VERCEL_ORG_ID }}"}' > .vercel/project.json

      - name: Deploy to Client Vercel (source deploy)
        run: vercel deploy --prod --no-wait --token=${{ secrets.CLIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.CLIENT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.CLIENT_VERCEL_PROJECT_ID }}
