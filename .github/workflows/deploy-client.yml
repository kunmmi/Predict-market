name: Deploy to Client Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-mine:
    name: Deploy to My Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.MY_VERCEL_PROJECT_ID }}","orgId":"${{ secrets.MY_VERCEL_ORG_ID }}"}' > .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.MY_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.MY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MY_VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --token=${{ secrets.MY_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.MY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MY_VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt artifact
        run: vercel deploy --prebuilt --prod --token=${{ secrets.MY_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.MY_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MY_VERCEL_PROJECT_ID }}

  deploy-client:
    name: Deploy to Client Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"${{ secrets.CLIENT_VERCEL_PROJECT_ID }}","orgId":"${{ secrets.CLIENT_VERCEL_ORG_ID }}"}' > .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.CLIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.CLIENT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.CLIENT_VERCEL_PROJECT_ID }}

      # The client's Vercel project blocks any deployment whose commit author
      # can't be matched to an authorized GitHub account on their (Hobby) plan.
      # Removing the git context means there is no commit author for Vercel to
      # reject, so the deploy is accepted and builds normally. (cloudflared.exe
      # is a 65MB tracked binary not needed for the build — drop it to keep the
      # upload small.)
      - name: Strip git context to bypass commit-author block
        run: |
          rm -rf .git
          rm -f cloudflared.exe

      - name: Deploy to Client Vercel (source build, no git author)
        run: vercel deploy --prod --token=${{ secrets.CLIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.CLIENT_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.CLIENT_VERCEL_PROJECT_ID }}
