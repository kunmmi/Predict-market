name: Deploy to Client Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          echo '{"projectId":"prj_nE6UFCF049bUlAp6gIt2KgxyE5pN","orgId":"team_eQLqGKZNPItECKwbFegFqTP2"}' > .vercel/project.json

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.CLIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_eQLqGKZNPItECKwbFegFqTP2
          VERCEL_PROJECT_ID: prj_nE6UFCF049bUlAp6gIt2KgxyE5pN

      - name: Build project
        run: vercel build --prod --token=${{ secrets.CLIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_eQLqGKZNPItECKwbFegFqTP2
          VERCEL_PROJECT_ID: prj_nE6UFCF049bUlAp6gIt2KgxyE5pN

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.CLIENT_VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_eQLqGKZNPItECKwbFegFqTP2
          VERCEL_PROJECT_ID: prj_nE6UFCF049bUlAp6gIt2KgxyE5pN
