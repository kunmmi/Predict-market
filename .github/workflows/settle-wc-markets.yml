name: Settle WC Markets

on:
  schedule:
    - cron: "0 */2 * * *"  # every 2 hours
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  settle-wc-markets:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WC market auto-settlement
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "Missing APP_URL GitHub variable."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET GitHub secret."
            exit 1
          fi

          curl --fail --show-error --silent \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/settle-wc-markets"
